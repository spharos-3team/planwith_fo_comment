spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/comment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:comment_user}
    password: ${DB_PASSWORD:comment_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8090}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  gateway:
    public-url: /
    auth-header-mapping-enabled: true
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
