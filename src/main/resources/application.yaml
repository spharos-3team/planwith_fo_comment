spring:
  application:
    name: planwith-fo-comment
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_ENABLED:false}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:planwith-fo-comment}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:0}

eureka:
  client:
    # Docker/AWS 기본 on. 로컬 단독은 .env에서 false로 끈다.
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      # Docker DNS 기본값. 로컬 Eureka는 .env에서 localhost로 덮어쓴다.
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Prefer Gateway-aggregated UI in Docker; enable locally if needed
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    # Relative "/" avoids embedding a host IP in OpenAPI servers.
    # Set to the public Gateway URL only when clients must see an absolute base (no LAN IP in git).
    public-url: ${GATEWAY_PUBLIC_URL:/}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-comment-deploy-v1}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      member-changed: ${KAFKA_TOPIC_MEMBER_CHANGED:member.changed}
      story-created: ${KAFKA_TOPIC_STORY_CREATED:story.created}
      story-updated: ${KAFKA_TOPIC_STORY_UPDATED:story.updated}
      story-deleted: ${KAFKA_TOPIC_STORY_DELETED:story.deleted}
      like-created: ${KAFKA_TOPIC_LIKE_CREATED:like.created}
      like-removed: ${KAFKA_TOPIC_LIKE_REMOVED:like.removed}
      comment-created: ${KAFKA_TOPIC_COMMENT_CREATED:comment.created}
      comment-updated: ${KAFKA_TOPIC_COMMENT_UPDATED:comment.updated}
      comment-deleted: ${KAFKA_TOPIC_COMMENT_DELETED:comment.deleted}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
